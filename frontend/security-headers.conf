# Included in every location of nginx.conf: Nginx drops server-level
# add_header directives inside any location that sets its own headers.
#
# Everything the SPA loads comes from this same origin — no inline
# scripts, no third-party hosts; connect-src 'self' covers the API, which
# the gateway serves on the same origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
