# Serves the built SPA inside the frontend container. The gateway
# proxies every non-API path here (gateway/nginx/nginx.conf).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/wallets/..., /admin/...) all load index.html,
    # which must never be cached so a deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
