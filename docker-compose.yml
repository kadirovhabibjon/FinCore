services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    env_file:
      - services/identity-service/.env
    environment:
      # Overrides the .env value: inside the compose network, the
      # database is reached by service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://identity:identity@postgres:5432/identity_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8091:8000"

  gateway:
    build:
      context: ./gateway/nginx
    depends_on:
      identity-service:
        condition: service_healthy
    ports:
      - "8180:80"

volumes:
  postgres_data:
