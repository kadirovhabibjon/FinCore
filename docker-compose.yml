services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      # OTLP is the wire format every service exports spans in
      # (fincore_common.tracing) — no separate collector needed in
      # front of Jaeger for a single-node dev setup.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      # Dev-only default credentials, same reasoning as every other
      # checked-in local dev secret in this repo (e.g. the Postgres
      # init scripts): a Docker network the developer's own machine
      # controls, not a deployed secret.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    env_file:
      - services/identity-service/.env
    environment:
      # Overrides the .env value: inside the compose network, the
      # database is reached by service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://identity:identity@postgres:5432/identity_db
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8091:8000"

  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    env_file:
      - services/ledger-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger:ledger@postgres:5432/ledger_db
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8092:8000"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      # Single-node KRaft mode (spec Section 14 picks Kafka; KRaft avoids
      # needing a separate Zookeeper service for local dev/CI — the same
      # broker every other environment runs is unaffected, KRaft is a
      # metadata-storage choice, not a client-visible one).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  fraud-service:
    build:
      context: .
      dockerfile: services/fraud-service/Dockerfile
    env_file:
      - services/fraud-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud_db
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8095:8000"

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    env_file:
      - services/payment-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://payment:payment@postgres:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8093:8000"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file:
      - services/notification-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://notification:notification@postgres:5432/notification_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8094:8000"

  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    env_file:
      - services/webhook-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://webhook:webhook@postgres:5432/webhook_db
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8097:8000"

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    env_file:
      - services/audit-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://audit:audit@postgres:5432/audit_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8098:8000"

  gateway:
    build:
      context: ./gateway/nginx
    depends_on:
      identity-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      webhook-service:
        condition: service_healthy
    ports:
      - "8180:80"

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
