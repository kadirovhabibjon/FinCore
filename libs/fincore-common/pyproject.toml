[project]
name = "fincore-common"
version = "0.1.0"
description = "Shared technical library for FinCore services: config, structured logging, correlation ID propagation. No domain models, no shared database."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "starlette>=0.38",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    # Distributed tracing (spec Section 24) — required from the start of
    # multi-service work, not an opt-in like the kafka extra below.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
# Only services that produce or consume Kafka events need this — not
# every service does (e.g. identity-service, ledger-service today).
kafka = [
    "aiokafka>=0.11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[kafka]>=4.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincore_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
