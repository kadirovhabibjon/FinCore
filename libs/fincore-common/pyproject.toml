[project]
name = "fincore-common"
version = "0.1.0"
description = "Shared technical library for FinCore services: config, structured logging, correlation ID propagation. No domain models, no shared database."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "starlette>=0.38",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincore_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
