[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally not set here: migrations/env.py sets it
# at runtime from app.core.config.settings, so there is exactly one place
# (the service's .env / environment) that defines which database a run
# talks to. This avoids a second, easily-forgotten source of truth.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
