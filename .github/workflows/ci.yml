name: CI

# One job per package (Section 26: "per changed service"). All jobs
# still run on every push/PR regardless of what changed; path filtering
# (or a matrix) so an unrelated service's change doesn't pay for a full
# pipeline run it didn't touch is future work once this gets noticeably
# slow, not before.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fincore-common:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/fincore-common
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,kafka]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test
        run: pytest -v

  identity-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fincore-common
        run: pip install -e ../../libs/fincore-common

      - name: Install identity-service
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Contract checks (contracts/openapi, contracts/events)
        # spec Section 26. Runs first, on its own, so a contract break
        # fails fast and reads as exactly that in the job summary; the
        # same tests also run again inside the full suite below.
        run: pytest -v -k contract

      - name: Test (unit + integration — real PostgreSQL via testcontainers)
        # DATABASE_URL / JWT_PRIVATE_KEY: no env vars needed here.
        # tests/conftest.py sets syntactically-valid placeholders so
        # import-time settings loading succeeds; integration tests point
        # at a real testcontainer explicitly instead.
        #
        # tests/integration/test_migrations.py is part of this run and
        # covers Section 26's "migration checks (upgrade from empty DB +
        # downgrade sanity)" — no separate step needed for that.
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/identity-service/Dockerfile -t fincore-identity-service:ci .

  ledger-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fincore-common
        run: pip install -e ../../libs/fincore-common

      - name: Install ledger-service
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Contract checks (contracts/openapi, contracts/events)
        # spec Section 26. Runs first, on its own, so a contract break
        # fails fast and reads as exactly that in the job summary; the
        # same tests also run again inside the full suite below.
        run: pytest -v -k contract

      - name: Test (unit + integration — real PostgreSQL via testcontainers)
        # DATABASE_URL / IDENTITY_SERVICE_JWKS_URL / INTERNAL_SERVICE_TOKEN:
        # no env vars needed here, same reasoning as identity-service —
        # tests/conftest.py sets placeholders, integration tests point at
        # a real testcontainer and a fake in-process JWKS endpoint.
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/ledger-service/Dockerfile -t fincore-ledger-service:ci .

  payment-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fincore-common
        run: pip install -e "../../libs/fincore-common[kafka]"

      - name: Install payment-service
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Contract checks (contracts/openapi, contracts/events)
        # spec Section 26. Runs first, on its own, so a contract break
        # fails fast and reads as exactly that in the job summary; the
        # same tests also run again inside the full suite below.
        run: pytest -v -k contract

      - name: Test (unit + integration — real PostgreSQL via testcontainers)
        # Same reasoning as identity-service/ledger-service:
        # tests/conftest.py sets placeholders for settings that would
        # otherwise fail to load at import time; integration tests point
        # at a real testcontainer and fake in-process ledger/fraud/JWKS
        # endpoints explicitly instead.
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/payment-service/Dockerfile -t fincore-payment-service:ci .

  notification-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fincore-common
        run: pip install -e "../../libs/fincore-common[kafka]"

      - name: Install notification-service
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Contract checks (contracts/openapi, contracts/events)
        # spec Section 26. Runs first, on its own, so a contract break
        # fails fast and reads as exactly that in the job summary; the
        # same tests also run again inside the full suite below.
        run: pytest -v -k contract

      - name: Test (unit + integration — real PostgreSQL and Kafka via testcontainers)
        # Same reasoning as the other services: tests/conftest.py sets a
        # placeholder DATABASE_URL for settings that would otherwise
        # fail to load at import time; integration tests point at real
        # testcontainers explicitly instead.
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/notification-service/Dockerfile -t fincore-notification-service:ci .

  fraud-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fraud-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fincore-common
        run: pip install -e ../../libs/fincore-common

      - name: Install fraud-service
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Contract checks (contracts/openapi, contracts/events)
        # spec Section 26. Runs first, on its own, so a contract break
        # fails fast and reads as exactly that in the job summary; the
        # same tests also run again inside the full suite below.
        run: pytest -v -k contract

      - name: Test (unit + integration — real PostgreSQL via testcontainers)
        # DATABASE_URL / INTERNAL_SERVICE_TOKEN: no env vars needed
        # here, same reasoning as the other services — tests/conftest.py
        # sets placeholders, integration tests point at a real
        # testcontainer explicitly.
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/fraud-service/Dockerfile -t fincore-fraud-service:ci .

  webhook-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webhook-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fincore-common
        run: pip install -e "../../libs/fincore-common[kafka]"

      - name: Install webhook-service
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Contract checks (contracts/openapi, contracts/events)
        # spec Section 26. Runs first, on its own, so a contract break
        # fails fast and reads as exactly that in the job summary; the
        # same tests also run again inside the full suite below.
        run: pytest -v -k contract

      - name: Test (unit + integration — real PostgreSQL and Kafka via testcontainers)
        # Same reasoning as the other services: tests/conftest.py sets
        # placeholder settings for import-time loading; integration
        # tests point at real testcontainers explicitly instead.
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/webhook-service/Dockerfile -t fincore-webhook-service:ci .

  audit-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audit-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fincore-common
        run: pip install -e "../../libs/fincore-common[kafka]"

      - name: Install audit-service
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Contract checks (contracts/openapi, contracts/events)
        # spec Section 26. Runs first, on its own, so a contract break
        # fails fast and reads as exactly that in the job summary; the
        # same tests also run again inside the full suite below.
        run: pytest -v -k contract

      - name: Test (unit + integration — real PostgreSQL and Kafka via testcontainers)
        # Same reasoning as the other services: tests/conftest.py sets
        # placeholder settings for import-time loading; integration
        # tests point at real testcontainers explicitly instead. Includes
        # a real, non-superuser-role privilege check that the migration
        # actually revokes UPDATE/DELETE/TRUNCATE on audit_logs (spec
        # Section 18's append-only rule), not just a descriptive claim.
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -f services/audit-service/Dockerfile -t fincore-audit-service:ci .

  e2e:
    # spec Section 26: "Plus e2e tests on the main branch." Only after
    # every package's own lint/type/unit/integration job has passed —
    # there's no point paying for a full-stack run on top of a failure a
    # faster job already caught.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - fincore-common
      - identity-service
      - ledger-service
      - payment-service
      - notification-service
      - fraud-service
      - webhook-service
      - audit-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate service .env files (fresh tokens and JWT key)
        run: ./scripts/generate-dev-env.sh

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install e2e suite
        working-directory: tests/e2e
        run: pip install -e ".[dev]"

      - name: Lint + type check e2e suite
        working-directory: tests/e2e
        run: ruff check . && mypy .

      - name: Run e2e tests (through the gateway, against the live stack)
        working-directory: tests/e2e
        run: pytest -v

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
