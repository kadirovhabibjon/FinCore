[project]
name = "fincore-e2e"
version = "0.1.0"
description = "FinCore end-to-end tests: full flows through the gateway against a running docker-compose stack (spec Section 23)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["e2e_client.py"]

[tool.pytest.ini_options]
testpaths = ["."]
# Each test creates its own users/wallets/merchants, so they're
# independent of each other and of whatever data is already in the stack
# — but they do share one live stack, so run them serially.
addopts = "-p no:cacheprovider"
markers = [
    "external_network: needs the stack's containers to reach the public internet",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
