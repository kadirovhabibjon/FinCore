[project]
name = "fincore-load"
version = "0.1.0"
description = "FinCore load test: a realistic mixed workload through the gateway, with a ledger reconciliation check at the end (spec Section 27, Phase 6)."
requires-python = ">=3.12"
dependencies = [
    "locust>=2.31",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["locustfile.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
