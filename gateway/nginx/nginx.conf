worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Reuse an inbound correlation ID if one already exists (a future
    # multi-hop call), otherwise mint one right here at the edge —
    # $request_id is an Nginx-core random hex identifier, good enough as
    # a fallback source of uniqueness. Every service downstream reuses
    # whatever arrives in this header rather than generating its own
    # (see fincore-common's CorrelationIdMiddleware), so one ID follows
    # a request through the whole system.
    # The public link (the ngrok container, scripts/setup-tunnel.sh) proxies
    # in from the compose network: take the client address it reports, so
    # login rate limits and session/audit IPs are per visitor rather than
    # one shared address. Only private-network peers are trusted, and with
    # real_ip_recursive the rightmost untrusted address wins, so a value a
    # visitor puts in X-Forwarded-For themselves is ignored.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent corr=$correlation_id rt=$request_time';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Reject unexpectedly large request bodies before they reach a
    # service (Section 3.2: gateway owns request size limits).
    client_max_body_size 1m;

    # A service that is down should fail fast (502 within seconds), not
    # after nginx's default 60 s connect timeout: the web app retries and
    # shows "can't reach" instead of a long blank wait.
    proxy_connect_timeout 3s;

    # Registration/login are brute-force targets; cap them per client IP.
    # 10r/s with a small burst is generous for a real user, tight for a
    # credential-stuffing script.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;

    # Each chat message is a paid Claude API call: a tight per-IP cap here
    # on top of assistant-service's own per-customer limit.
    limit_req_zone $binary_remote_addr zone=assistant_zone:10m rate=6r/m;

    upstream identity_service {
        server identity-service:8000;
    }

    upstream ledger_service {
        server ledger-service:8000;
    }

    upstream payment_service {
        server payment-service:8000;
    }

    upstream webhook_service {
        server webhook-service:8000;
    }

    upstream assistant_service {
        server assistant-service:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=20 nodelay;

            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # Checks the current password, so it gets the same brute-force
        # cap as login (exact match wins over the /api/v1/users/ prefix).
        location = /api/v1/users/me/password {
            limit_req zone=auth_zone burst=20 nodelay;

            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/users/ {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/wallets {
            proxy_pass http://ledger_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/transfers {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/transactions {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/payments {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/merchants {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/webhooks {
            proxy_pass http://webhook_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/assistant/ {
            limit_req zone=assistant_zone burst=5 nodelay;
            # 429 like the service's own limit, not nginx's default 503.
            limit_req_status 429;

            proxy_pass http://assistant_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
            # A reply with tool calls can take tens of seconds.
            proxy_read_timeout 180s;
        }

        # The admin API (ADR-0005) is split across the services that own
        # the data; each checks the caller's role itself, the gateway only
        # routes. The two specific prefixes win over the general one
        # because Nginx picks the longest matching prefix location.
        location /api/v1/admin/users {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/admin/webhooks {
            proxy_pass http://webhook_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /api/v1/admin/ {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # Any other /api/ path is an unknown API route, and /internal/* and
        # /metrics exist only on the container network (spec Section 19):
        # answer 404 here rather than letting them fall through to the
        # SPA's index.html below.
        location /api/ {
            default_type application/problem+json;
            return 404 '{"type":"about:blank","title":"Not Found","status":404}';
        }

        location /internal/ {
            default_type application/problem+json;
            return 404 '{"type":"about:blank","title":"Not Found","status":404}';
        }

        location = /metrics {
            default_type application/problem+json;
            return 404 '{"type":"about:blank","title":"Not Found","status":404}';
        }

        # JWKS is public key material, not a secret — published so any
        # service (or external verifier) can validate a FinCore JWT.
        location = /.well-known/jwks.json {
            proxy_pass http://identity_service;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # The gateway's own liveness, answered by Nginx directly — not
        # proxied to any one backend service, since "is the gateway up"
        # and "is service X up" are different questions. Each service's
        # own /health and /ready are reachable directly (not through the
        # gateway) for per-service checks.
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # Everything else is the React SPA (ADR-0005), served by the
        # frontend container. Same origin as the API, so the browser
        # needs no CORS and the SameSite=Strict refresh cookie (ADR-0006)
        # is sent on /api/v1/auth/* calls.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
        }
    }
}
