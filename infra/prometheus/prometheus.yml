# Scrapes every service's /metrics endpoint (spec Section 24,
# fincore_common.configure_metrics). Container-network hostnames match
# docker-compose.yml's service names — the same "reach each other by
# service name inside the network" pattern every internal HTTP call in
# this project already uses.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: identity-service
    static_configs:
      - targets: ["identity-service:8000"]

  - job_name: ledger-service
    static_configs:
      - targets: ["ledger-service:8000"]

  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:8000"]

  - job_name: fraud-service
    static_configs:
      - targets: ["fraud-service:8000"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8000"]

  - job_name: webhook-service
    static_configs:
      - targets: ["webhook-service:8000"]

  - job_name: audit-service
    static_configs:
      - targets: ["audit-service:8000"]
